[package]
name = "kilatx"
version = "0.5.3"
edition = "2021"
description = "KilatX - multi-connection downloads for Windows"
license = "GPL-3.0-only"
repository = "https://github.com/marcos-liao/KilatX"
publish = false

[[bin]]
name = "KilatX"
path = "src/main.rs"

[dependencies]
slint = "1"
tokio = { version = "1", features = ["rt-multi-thread", "time", "macros", "net", "io-util"] }
reqwest = { version = "0.12", features = ["stream", "socks"] }
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "6"
rfd = "0.15"
open = "5"
arboard = "3"
percent-encoding = "2"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
md-5 = "0.10"
sha2 = "0.10"
ed25519-dalek = "2"
getrandom = "0.2"

[target.'cfg(windows)'.dependencies]
windows-registry = "0.6"
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_System_IO",
    "Win32_Security",
    "Win32_Security_Cryptography",
    "Win32_System_LibraryLoader",
    "Win32_System_Registry",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_Graphics_Gdi",
    "Win32_System_Ioctl",
    "Win32_System_DataExchange",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_Threading",
    "Win32_System_Console",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Variant",
    "Win32_UI_Shell_PropertiesSystem",
    "Win32_Storage_EnhancedStorage",
    "Win32_Storage_FileSystem",
    "Win32_UI_Shell",
    "Data_Xml_Dom",
    "UI_Notifications",
    "Foundation_Collections",
] }

[build-dependencies]
slint-build = "1"

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
